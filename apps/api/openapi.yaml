openapi: 3.0.3
info:
  title: Unijoy API
  version: 1.0.0
  description: API documentation for Unijoy platform
  contact:
    name: Unijoy Development Team
server:
  url: http://localhost:8080
  description: Local development server
paths:
  /api/auth/register:
    post:
      summary: Register a new user
      operationId: register
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegisterRequest'
      responses:
        '200':
          description: Registration successful
        '400':
          description: Bad request - validation error
  /api/auth/login:
    post:
      summary: User login
      operationId: login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials
  /api/auth/logout:
    post:
      summary: User logout
      operationId: logout
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
  /api/users/profile:
    get:
      summary: Get user profile
      operationId: getProfile
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved
        '401':
          description: Unauthorized
  /api/events:
    get:
      summary: Get all events
      operationId: getEvents
      tags: [Events]
      responses:
        '200':
          description: List of events retrieved
  /api/events/{id}:
    get:
      summary: Get event by ID
      operationId: getEventById
      tags: [Events]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event details
        '404':
          description: Event not found
  /api/halls:
    get:
      summary: Get all halls
      operationId: getHalls
      tags: [Halls]
      responses:
        '200':
          description: List of halls retrieved
components:
  schemas:
    AuthRegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          description: User's full name
        email:
          type: string
          format: email
          description: User's email address
        password:
          type: string
          minLength: 6
          description: User's password
    AuthLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User's email address
        password:
          type: string
          description: User's password
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Error message
        data:
          type: object
          description: Additional error data
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Authentication routes
  - name: Users
    description: User management routes
  - name: Events
    description: Event routes
  - name: Halls
    description: Hall management routes