name: CI / CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  audit:
    name: CI / Dependency audit
    runs-on: ubuntu-latest
    concurrency:
      group: ci-audit-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=critical

  api:
    name: CI / API (test)
    runs-on: ubuntu-latest
    concurrency:
      group: ci-api-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test --workspace=apps/api

  website:
    name: CI / Website (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    concurrency:
      group: ci-website-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --workspace=apps/website
      - run: npx tsc --noEmit --project apps/website/tsconfig.json
      - run: npm run test --workspace=apps/website
      - run: npm run build --workspace=apps/website

  e2e:
    name: CI / End-to-end (Playwright)
    runs-on: ubuntu-latest
    concurrency:
      group: ci-e2e-${{ github.ref }}
      cancel-in-progress: true
    needs: [api, website]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:e2e
      - uses: playwright/action@v1
        with:
          working-directory: .
          config: playwright.config.ts

  vercel:
    name: CI / Vercel Deployment
    runs-on: ubuntu-latest
    concurrency:
      group: ci-vercel-${{ github.ref }}
      cancel-in-progress: true
    needs: website
    steps:
      - uses: actions/checkout@v4
      - uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-organization-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: apps/website
          alias-domains: ''
          git-command: ''
          flag: production